name: Build and test microservices

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Static code analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: semgrep/semgrep:1.163.0

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Analyze source code
        run: semgrep scan --config auto --error .

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan dependencies for high and critical vulnerabilities
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          -w /workspace
          ghcr.io/aquasecurity/trivy:0.76.2
          fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git .

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out commit history for the scan range
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan Git history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

  scan-container-images:
    name: Build and scan container images
    if: github.event_name == 'pull_request'
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build and scan all service images
        run: bash .github/scripts/build-scan-publish-images.sh

  build-and-test:
    name: Build and API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate temporary credentials for the test stack
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 16)"
          admin_password="$(openssl rand -hex 16)"
          admin_jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$admin_jwt_secret"
          {
            echo "POSTGRES_USER=retail_user"
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "ORDERS_DB=orders"
            echo "ADMIN_USERNAME=ci-admin"
            echo "ADMIN_PASSWORD=$admin_password"
            echo "ADMIN_JWT_SECRET=$admin_jwt_secret"
          } >> "$GITHUB_ENV"

      - name: Build all service images
        run: docker compose build catalog carts orders checkout ui admin

      - name: Start the application stack
        run: docker compose up --detach --no-build db redis catalog carts orders checkout ui

      - name: Wait for catalog and cart APIs
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/catalog/products >/dev/null && \
               curl --fail --silent http://localhost:8080/api/carts/ci-readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Set up Node.js for Newman
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run Newman API tests
        run: >-
          npx --yes newman@6.2.3 run
          tests/postman/tero-api.postman_collection.json
          --env-var "baseUrl=http://localhost:8080"
          --env-var "customerId=ci-${GITHUB_RUN_ID}"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-images:
    name: Scan and publish images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - code-quality
      - dependency-scan
      - secret-scan
      - build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build, scan, and publish all service images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_IMAGES: "true"
        run: bash .github/scripts/build-scan-publish-images.sh
