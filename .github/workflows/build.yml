name: Build and test microservices

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate temporary credentials for the test stack
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 16)"
          admin_password="$(openssl rand -hex 16)"
          admin_jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$admin_jwt_secret"
          {
            echo "POSTGRES_USER=retail_user"
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "ORDERS_DB=orders"
            echo "ADMIN_USERNAME=ci-admin"
            echo "ADMIN_PASSWORD=$admin_password"
            echo "ADMIN_JWT_SECRET=$admin_jwt_secret"
          } >> "$GITHUB_ENV"

      - name: Build all service images
        run: docker compose build catalog carts orders checkout ui admin

      - name: Start the application stack
        run: docker compose up --detach --no-build

      - name: Wait for catalog and cart APIs
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/catalog/products >/dev/null && \
               curl --fail --silent http://localhost:8080/api/carts/ci-readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Set up Node.js for Newman
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Newman API tests
        run: >-
          npx --yes newman@6.2.3 run
          tests/postman/tero-api.postman_collection.json
          --env-var "baseUrl=http://localhost:8080"
          --env-var "customerId=ci-${GITHUB_RUN_ID}"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
